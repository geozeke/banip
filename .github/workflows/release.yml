name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Validate and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
      - uses: extractions/setup-just@v3
      - name: Sync locked dependencies
        run: uv sync --locked --all-groups
      - name: Validate release metadata and notes
        run: uv run python -m scripts.validate_release "$GITHUB_REF_NAME"
      - name: Run release quality checks
        run: just check
      - name: Build distributions
        run: |
          uv build --sdist
          uv build --wheel
      - name: Extract release notes
        run: uv run python -m scripts.extract_release_notes "$GITHUB_REF_NAME" .release-notes.md
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="banip $GITHUB_REF_NAME"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "$title" \
              --notes-file .release-notes.md
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          elif [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$title" \
              --notes-file .release-notes.md \
              --prerelease \
              --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$title" \
              --notes-file .release-notes.md \
              --verify-tag
          fi
      - name: Update stable installation tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_release_tag="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name
          )"
          uv run python -m scripts.update_latest_tag \
            "$GITHUB_REF_NAME" \
            "$latest_release_tag" \
            "$GITHUB_SHA"
