name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
      - uses: extractions/setup-just@v3
      - name: Sync locked dependencies
        run: uv sync --locked --all-groups
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uv run python -m scripts.check_commit_title "$PR_TITLE"
      - name: Run local-equivalent checks
        run: just check
      - name: Build distributions
        run: |
          uv build --sdist --no-sources
          uv build --wheel --no-sources
      - name: Smoke-test wheel
        run: >-
          uv run --isolated --no-project --no-cache
          --with dist/*.whl
          -- python tests/package_smoke.py
      - name: Smoke-test source distribution
        run: >-
          uv run --isolated --no-project --no-cache
          --with dist/*.tar.gz
          -- python tests/package_smoke.py
