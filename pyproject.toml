[project]
name = "banip"
version = "2.1.0rc2"
description = "Create country-focused IP blocklists"
keywords = ["blocklist", "firewall", "geolocation", "ip-address", "security"]
license = "MIT"
license-files = ["LICEN[CS]E*"]
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking :: Firewalls",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.32.3",
    "rich>=15.0.0",
    "ruamel-yaml>=0.19.1",
]
authors = [
    {name = "Peter Nardi", email = "geozeke@gmail.com"},
]

[project.urls]
Homepage = "https://github.com/geozeke/banip"
Documentation = "https://geozeke.github.io/banip/"
Repository = "https://github.com/geozeke/banip"
Issues = "https://github.com/geozeke/banip/issues"
Changelog = "https://github.com/geozeke/banip/blob/main/CHANGELOG.md"

[dependency-groups]
docs = [
    "zensical>=0.0.51,<0.1",
]
security = [
    "pip-audit>=2.9,<3",
]
dev = [
    "mypy>=2.0.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.16",
]

[tool.uv]
cache-dir = ".uv-cache"
python-preference = "only-managed"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.uv.sources]
banip = { workspace = true }

[project.scripts]
banip = "banip.app:main"

[build-system]
requires = ["uv-build>=0.12.0,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = [
    "changelogs/**",
    "global-gitignore.txt",
    "samples/**",
]
source-exclude = [
    ".uv-cache/**",
]
